name: tearoad

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:?Set VITE_SUPABASE_URL in deploy/.env}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:?Set VITE_SUPABASE_PUBLISHABLE_KEY in deploy/.env}
        VITE_SITE_URL: https://tearoad.localhost
    image: tearoad-frontend:local
    restart: unless-stopped
    expose:
      - "8080"
    networks:
      web:
        aliases:
          - frontend
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: tearoad-backend:local
    restart: unless-stopped
    expose:
      - "3000"
    networks:
      - web
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    user: "101:101"
    entrypoint: ["nginx"]
    command: ["-g", "daemon off;"]
    depends_on:
      frontend:
        condition: service_healthy
    ports:
      - "127.0.0.1:80:8080"
      - "127.0.0.1:443:8443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /run:uid=101,gid=101,mode=755,size=1m
      - /var/cache/nginx:uid=101,gid=101,mode=755,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - web
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-q", "-O", "/dev/null", "https://127.0.0.1:8443/"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  web:
